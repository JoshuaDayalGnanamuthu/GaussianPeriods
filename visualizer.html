<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaussian Periods Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="canvas-wrap">
      <canvas id="canvas" width="1000" height="750"></canvas>
      <div id="animationCounter" style="position: absolute; top: 1rem; left: 1rem; font-size: 0.85rem; color: #fff; font-family: Georgia, 'Times New Roman', serif; display: none; background: rgba(0,0,0,0.6); padding: 0.4rem 0.6rem; border-radius: 4px; border: 1px solid #444;"></div>
      <div id="tooltip"></div>
      <div class="canvas-toolbar">
        <button class="toolbar-btn" id="downloadPngBtn" title="Download plot as PNG">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
          </svg>
        </button>
        <button class="toolbar-btn" id="downloadCsvBtn" title="Download data as CSV">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18h14v2H5z"/>
          </svg>
        </button>
        <button class="toolbar-btn" id="resetAxisBtn" title="Reset axes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </button>
        <button class="toolbar-btn" id="zoomInBtn" title="Zoom in">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </button>
        <button class="toolbar-btn" id="zoomOutBtn" title="Zoom out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13H5v-2h14v2z"/>
          </svg>
        </button>
        <button class="toolbar-btn" id="boxZoomBtn" title="Box zoom">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="6"></circle>
            <path d="m14.5 14.5 4.5 4.5"></path>
            <rect x="6" y="6" width="8" height="8" stroke-dasharray="2,2"></rect>
          </svg>
        </button>
        <button class="toolbar-btn" id="fullscreenBtn" title="Toggle fullscreen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
        </button>
      </div>
      <div class="color-previews-container">
        <div class="color-previews-scroll">
          <div id="colorPreviewsWrapper" class="color-previews-wrapper"></div>
        </div>
        <button id="viewAllButton" class="preview-button view-all-btn">View All</button>
      </div>
    </section>

        <section class="controls">
      <a href="index.html" id="logo" class="home-link">Gaussian Periods Visualizer</a>

      <div class="grid">
        <label>N<input id="nInput" type="text" min="2"/></label>

        <label>omega<input id="wInput" type="text" min="1"/></label>

        <label>colors<input id="cInput" type="text" min="1"/></label>

        <button id="plotButton">Plot</button>

        <label>Track k<input id="kInput" type="text" placeholder="Enter k value" /></label>

        <label>
          <div class="label-with-info">
            Track k (slider)
            <span id="kSliderValue">(enter n first)</span>
          </div>
          <div class="slider-container">
            <input id="kSlider" type="range" min="0" max="0" step="1" value="0" disabled />
          </div>
        </label>

        <div class="playback-controls">
          <button id="playButton" type="button">▶ Play</button>
          <button id="pauseButton" type="button" style="display: none;">⏸ Pause</button>
          <label>
            Speed
            <div class="slider-container">
              <input id="speedSlider" type="range" min="0.1" max="50" step="0.1" value="1" />
              <span id="speedValue">1.0x</span>
            </div>
          </label>
        </div>
      </div>

      <p id="status">Enter coprime n and w, then plot.</p>
    </section>
  </main>

  <script type="module" src="script-refactored.js"></script>
</body>
</html>
